name: Sync fork from upstream

# 自动把上游 DanWBR/dwsim10 的 master 同步到这个 fork。
#
# 触发方式：
#   1. 定时：每小时整点自动运行
#   2. 手动：Actions 页面 → Sync fork from upstream → Run workflow
#   3. 需要同步时：gh workflow run sync-fork.yml --repo rzhli/dwsim10

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# master 保留上游源码，但已删除上游的 build.yml / release.yml。
# 上游修改这些文件会让 merge-upstream 返回 409。使用 Git 合并，并仅处理
# 这两个文件在 fork 中已删除、上游继续修改的冲突；源码冲突仍然失败。
# 推送可能包含 workflow 更新，继续使用带 workflow scope 的 SYNC_PAT。
permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master into fork master
    if: github.repository == 'rzhli/dwsim10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail
          echo "Syncing rzhli/dwsim10 master <- DanWBR/dwsim10 master ..."
          git remote add upstream https://github.com/DanWBR/dwsim10.git
          git fetch --no-tags upstream refs/heads/master:refs/remotes/upstream/master

          if git merge-base --is-ancestor refs/remotes/upstream/master HEAD; then
            echo "Fork master already contains upstream master."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git merge --no-ff --no-commit refs/remotes/upstream/master; then
            mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
            if (( ${#conflicts[@]} == 0 )); then
              echo "::error::Git merge failed without a resolvable file conflict."
              exit 1
            fi
            # Validate every conflict before applying the fork's deletion policy.
            for conflict_path in "${conflicts[@]}"; do
              case "$conflict_path" in
                .github/workflows/build.yml|.github/workflows/release.yml)
                  if git cat-file -e "HEAD:$conflict_path" 2>/dev/null || \
                     ! git cat-file -e ":1:$conflict_path" 2>/dev/null || \
                     ! git cat-file -e ":3:$conflict_path" 2>/dev/null; then
                    echo "::error::Unexpected workflow conflict: $conflict_path"
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::Manual resolution required: $conflict_path"
                  exit 1
                  ;;
              esac
            done
            git rm -- "${conflicts[@]}"
          fi

          # Preserve upstream source verbatim; check only the fork's workflow changes.
          git diff --cached --check -- .github/workflows
          git commit -m "Merge upstream master, preserve disabled fork release workflows"
          git push origin --no-follow-tags HEAD:refs/heads/master

      - name: Report the merge result
        if: ${{ failure() }}
        run: |
          echo "::warning::Sync failed. Possible causes:"
          echo "  - SYNC_PAT secret missing or missing repo/workflow scopes"
          echo "  - an upstream conflict needs manual review"
          echo "  - fork master changed during this run; retry the sync"
          echo "  - API rate limit"
          echo "Check the failing step, resolve unsupported conflicts, then re-run."
